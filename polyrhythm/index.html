<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Polyrhythmic Spiral, Working-Draft.org
    Based on the polyrhythmic spiral by codepen/Hyperplexed, inspired by @project_jdm.
    Modified by Arttu Pitou At: Web Audio synth with selectable modal scales
    and synthesized instruments, switchable pitch direction, octave shift, missed-impact fix,
    iOS audio session handling, new presentation, tint non-pentatonic shifting degrees
    in Dorian, Aeolian and Lydian scales, accounting for the inner-high setting.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Open Graph / Facebook / Discord / Slack -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://working-draft.org/polyrhythm/">
  <meta property="og:title" content="Polyrhythmic Spiral | Working Draft">
  <meta property="og:description" content="An interactive, polyrhythmic audio-visualizer built with the Web Audio API and HTML5 canvas.">
  <meta property="og:image" content="https://working-draft.org/assets/images/polyrhythm.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://working-draft.org/polyrhythm/">
  <meta name="twitter:title" content="Polyrhythmic Spiral | Working Draft">
  <meta name="twitter:description" content="An interactive, polyrhythmic audio-visualizer built with the Web Audio API and HTML5 canvas.">
  <meta name="twitter:image" content="https://working-draft.org/assets/images/polyrhythm.png">
  <title>Polyrhythmic Spiral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100vh;
      height: 100dvh;
      background-color: black;
      overflow: hidden;
      font-family: "Noto Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    canvas {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      position: relative;
      z-index: 9;
    }

    #background-image,
    #background-filter {
      height: 100%;
      width: 100%;
      position: fixed;
      top: 0px;
      left: 0px;
    }

    #background-image {
      z-index: 1;
      background-image: url("https://images.unsplash.com/photo-1505136026201-bbc1bc0949fa?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      filter: blur(4px) grayscale(30%);
    }

    #background-filter {
      z-index: 2;
      background: radial-gradient(rgb(0 0 0 / 60%) 50%, transparent);
    }

    #logo {
      display: flex;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      opacity: 0.2;
      pointer-events: none;
    }

    #logo > img {
      height: 18vmin;
      width: auto;
    }

    #control-bar-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      position: fixed;
      top: 0px;
      left: 0px;
      z-index: 10;
      padding: 0.5rem;
    }

    #control-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    #octave-control {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    #octave-control .toggle {
      color: white;
      font-size: 1rem;
      line-height: 1;
      width: 2rem;
      padding: 0;
    }

    #octave-display {
      color: white;
      font-size: 0.8rem;
      min-width: 1.75rem;
      text-align: center;
    }

    .toggle {
      background-color: rgb(255 255 255 / 10%);
      backdrop-filter: blur(5px);
      padding: 0.5rem;
      border-radius: 0.25rem;
      height: 2rem;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .toggle:is(:hover, :focus-visible) {
      background-color: rgb(255 255 255 / 15%);
    }

    .toggle > i {
      color: white;
      display: none;
      height: 1rem;
      width: 1rem;
      font-size: 0.6rem;
      line-height: 1rem;
      text-align: center;
    }

    .toggle[data-toggled="true"] > i.on {
      display: block;
    }

    .toggle[data-toggled="false"] > i.off {
      display: block;
    }

    select.toggle {
      color: white;
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0 0.5rem;
    }

    select.toggle option {
      color: black;
    }

    #sound-message {
      position: fixed;
      top: 36%;
      left: 50%;
      translate: -50% -50%;
      z-index: 3;
      padding: 0.75rem;
      background-color: rgb(255 255 255 / 5%);
      border-radius: 0.4rem;
      transition: opacity 1000ms;
      pointer-events: none;
    }

    body:has(#sound-toggle[data-toggled="true"]) #sound-message {
      opacity: 0;
    }

    #sound-message > p {
      color: white;
      font-size: 0.9rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="control-bar-wrapper">
    <div id="control-bar">
      <button id="sound-toggle" class="toggle" type="button" data-toggled="false" onClick="handleSoundToggle()" title="Toggle Sound">
        <i class="fa-solid fa-volume-xmark off"></i>
        <i class="fa-solid fa-music on"></i>
      </button>
      <select id="scale-select" class="toggle" title="Scale">
        <option value="dorian">Dorian</option>
        <option value="aeolian">Aeolian</option>
        <option value="lydian">Lydian</option>
        <option value="pentatonic">Pentatonic</option>
      </select>
      <select id="instrument-select" class="toggle" title="Instrument">
        <option value="vibraphone">Vibraphone</option>
        <option value="bell">Bell</option>
        <option value="sine">Sine</option>
      </select>
      <select id="direction-select" class="toggle" title="Pitch direction">
        <option value="high">Inner high</option>
        <option value="low">Inner low</option>
      </select>
      <div id="octave-control" title="Octave">
        <button id="octave-down" class="toggle" type="button">&minus;</button>
        <span id="octave-display">0</span>
        <button id="octave-up" class="toggle" type="button">+</button>
      </div>
    </div>
  </div>

  <div id="background-image"></div>
  <div id="background-filter"></div>

  <div id="logo">
    <img src="https://working-draft.org/assets/working-draft-flower.png" alt="Working Draft" />
  </div>

  <div id="sound-message">
    <p>Click anywhere to toggle sound</p>
  </div>

  <canvas id="paper"></canvas>

  <script>
    const paper = document.getElementById("paper"),
          pen = paper.getContext("2d");

    const get = selector => document.querySelector(selector);

    const toggles = {
      sound: get("#sound-toggle")
    }

    const colors = Array(21).fill("#A6C48A");

    const settings = {
      startTime: new Date().getTime(),
      duration: 900,
      maxCycles: Math.max(colors.length, 100),
      soundEnabled: false,
      pulseEnabled: true,
      scale: "dorian",
      instrument: "vibraphone",
      innerHigh: true,
      octave: 0,
      minOctave: -2,
      maxOctave: 1
    }

    // ---------- Scales and frequencies ----------
    const scales = {
      dorian:     [0, 2, 3, 5, 7, 9, 10],
      aeolian:    [0, 2, 3, 5, 7, 8, 10],
      lydian:     [0, 2, 4, 6, 7, 9, 11],
      pentatonic: [0, 3, 5, 7, 10]
    };

    const buildFrequencies = () => {
      const scale = scales[settings.scale],
            baseNote = 146.83; // D3
      return Array(colors.length).fill(0).map((_, i) => {
        const octave = Math.floor(i / scale.length),
              degree = i % scale.length;
        return baseNote * Math.pow(2, octave + scale[degree] / 12);
      });
    };

    let frequencies = buildFrequencies();

    // ---------- Instruments ----------
    // partials: [frequency ratio, level, decay seconds]
    const voices = {
      vibraphone: { type: 'sine', partials: [[1, 1, 2.5], [4, 0.15, 0.6]] },
      bell: { type: 'sine', partials: [[1, 1, 2.5], [2.76, 0.25, 1.0], [5.4, 0.08, 0.4]] },
      sine: { type: 'sine', partials: [[1, 1, 2.5]] }
    };

    const noteFor = index =>
      frequencies[settings.innerHigh ? frequencies.length - 1 - index : index]
        * Math.pow(2, settings.octave);

    let audioCtx;

    const playKey = index => {
      if (!audioCtx) return;

      const now = audioCtx.currentTime,
            freq = noteFor(index),
            voice = voices[settings.instrument];

      let dest = audioCtx.destination;
      if (voice.lowpass) {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = voice.lowpass;
        filter.connect(dest);
        dest = filter;
      }

      voice.partials.forEach(([ratio, level, decay]) => {
        const osc = audioCtx.createOscillator(),
              gain = audioCtx.createGain();

        osc.type = voice.type;
        osc.frequency.value = freq * ratio;

        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.2 * level, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + decay);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(now);
        osc.stop(now + decay + 0.1);
      });
    };

    // ---------- Controls ----------
    const handleSoundToggle = (enabled = !settings.soundEnabled) => {
      settings.soundEnabled = enabled;
      toggles.sound.dataset.toggled = enabled;

      if (enabled) {
        if (navigator.audioSession) navigator.audioSession.type = 'playback';

        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }
    };

    document.onvisibilitychange = () => handleSoundToggle(false);
    paper.onclick = () => handleSoundToggle();

    get("#scale-select").onchange = e => {
      settings.scale = e.target.value;
      frequencies = buildFrequencies();
    };
    get("#instrument-select").onchange = e => settings.instrument = e.target.value;
    get("#direction-select").onchange = e => settings.innerHigh = e.target.value === "high";

    const shiftOctave = delta => {
      settings.octave = Math.max(settings.minOctave, Math.min(settings.maxOctave, settings.octave + delta));
      get("#octave-display").textContent = settings.octave > 0 ? "+" + settings.octave : settings.octave;
    };
    get("#octave-down").onclick = () => shiftOctave(-1);
    get("#octave-up").onclick = () => shiftOctave(1);

    // ---------- Animation ----------
    let arcs = [];

    const calculateVelocity = index => {
      const numberOfCycles = settings.maxCycles - index,
            distancePerCycle = 2 * Math.PI;
      return (numberOfCycles * distancePerCycle) / settings.duration;
    }

    const calculateNextImpactTime = (currentImpactTime, velocity) => {
      return currentImpactTime + (Math.PI / velocity) * 1000;
    }

    const calculateDynamicOpacity = (currentTime, lastImpactTime, baseOpacity, maxOpacity, duration) => {
      const timeSinceImpact = currentTime - lastImpactTime,
            percentage = Math.min(timeSinceImpact / duration, 1),
            opacityDelta = maxOpacity - baseOpacity;

      return maxOpacity - (opacityDelta * percentage);
    }

    const determineOpacity = (currentTime, lastImpactTime, baseOpacity, maxOpacity, duration) => {
      if(!settings.pulseEnabled) return baseOpacity;
      return calculateDynamicOpacity(currentTime, lastImpactTime, baseOpacity, maxOpacity, duration);
    }

    const calculatePositionOnArc = (center, radius, angle) => ({
      x: center.x + radius * Math.cos(angle),
      y: center.y + radius * Math.sin(angle)
    });

    const init = () => {
      pen.lineCap = "round";

      arcs = colors.map((color, index) => {
        const velocity = calculateVelocity(index),
              lastImpactTime = 0,
              nextImpactTime = calculateNextImpactTime(settings.startTime, velocity);

        return { color, velocity, lastImpactTime, nextImpactTime }
      });
    }

    const drawArc = (x, y, radius, start, end, action = "stroke") => {
      pen.beginPath();
      pen.arc(x, y, radius, start, end);
      if(action === "stroke") pen.stroke();
      else pen.fill();
    }

    const drawPointOnArc = (center, arcRadius, pointRadius, angle) => {
      const position = calculatePositionOnArc(center, arcRadius, angle);
      drawArc(position.x, position.y, pointRadius, 0, 2 * Math.PI, "fill");
    }

    // Scale degrees (0-based) that can differ between Dorian, Aeolian and Lydian
    const shiftingDegrees = [2, 3, 5, 6]; // 3rd, 4th, 6th, 7th
    const SHIFT_PINK = "#f0a3bc";         // Alien Conspiracy Pink

    const tintFor = index => {
      if (settings.scale === "pentatonic") return colors[index];

      const scale = scales[settings.scale],
            noteIndex = settings.innerHigh ? colors.length - 1 - index : index,
            degree = noteIndex % scale.length,
            isPentatonicNote = scales.pentatonic.includes(scale[degree]);

      return shiftingDegrees.includes(degree) && !isPentatonicNote
        ? SHIFT_PINK
        : colors[index];
    };

    const draw = () => {
      paper.width = paper.clientWidth;
      paper.height = paper.clientHeight;

      const currentTime = new Date().getTime(),
            elapsedTime = (currentTime - settings.startTime) / 1000;

      const length = Math.min(paper.width, paper.height) * 0.9,
            offset = (paper.width - length) / 2;

      const start = { x: offset, y: paper.height / 2 }
      const end = { x: paper.width - offset, y: paper.height / 2 }
      const center = { x: paper.width / 2, y: paper.height / 2 }

      const base = {
        length: end.x - start.x,
        minAngle: 0,
        startAngle: 0,
        maxAngle: 2 * Math.PI
      }

      base.initialRadius = base.length * 0.05;
      base.circleRadius = base.length * 0.006;
      base.clearance = base.length * 0.03;
      base.spacing = (base.length - base.initialRadius - base.clearance) / 2 / colors.length;

      arcs.forEach((arc, index) => {
        arc.color = tintFor(index); // NEW

        const radius = base.initialRadius + (base.spacing * index);

        pen.globalAlpha = determineOpacity(currentTime, arc.lastImpactTime, 0.15, 0.65, 1000);
        pen.lineWidth = base.length * 0.002;
        pen.strokeStyle = arc.color;

        const offset = base.circleRadius * (5 / 3) / radius;

        drawArc(center.x, center.y, radius, Math.PI + offset, (2 * Math.PI) - offset);
        drawArc(center.x, center.y, radius, offset, Math.PI - offset);

        pen.globalAlpha = determineOpacity(currentTime, arc.lastImpactTime, 0.15, 0.85, 1000);
        pen.fillStyle = arc.color;

        drawPointOnArc(center, radius, base.circleRadius * 0.75, Math.PI);
        drawPointOnArc(center, radius, base.circleRadius * 0.75, 2 * Math.PI);

        pen.globalAlpha = 1;
        pen.fillStyle = arc.color;

        if(currentTime >= arc.nextImpactTime) {
          const interval = (Math.PI / arc.velocity) * 1000;

          // Jump past any impacts missed while the tab was hidden/throttled
          const missed = Math.floor((currentTime - arc.nextImpactTime) / interval);
          arc.lastImpactTime = arc.nextImpactTime + missed * interval;
          arc.nextImpactTime = arc.lastImpactTime + interval;

          // Only sound impacts that are happening now, not stale ones
          if(settings.soundEnabled && currentTime - arc.lastImpactTime < 100) {
            playKey(index);
          }
        }

        const distance = elapsedTime >= 0 ? (elapsedTime * arc.velocity) : 0,
              angle = (Math.PI + distance) % base.maxAngle;

        drawPointOnArc(center, radius, base.circleRadius, angle);
      });

      requestAnimationFrame(draw);
    }

    init();
    draw();
  </script>
</body>
</html>
