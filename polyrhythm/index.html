<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Open Graph / Facebook / Discord / Slack -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://working-draft.org/polyrhythm/">
  <meta property="og:title" content="Polyrhythmic Spiral | Working Draft">
  <meta property="og:description" content="An interactive, polyrhythmic audio-visualizer built with the Web Audio API and HTML5 canvas.">
  <meta property="og:image" content="https://working-draft.org/assets/images/polyrhythm.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://working-draft.org/polyrhythm/">
  <meta name="twitter:title" content="Polyrhythmic Spiral | Working Draft">
  <meta name="twitter:description" content="An interactive, polyrhythmic audio-visualizer built with the Web Audio API and HTML5 canvas.">
  <meta name="twitter:image" content="https://working-draft.org/assets/images/polyrhythm.png">
  <title>Polyrhythmic Spiral</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html, body {
      height: 100vh;
      background-color: black;
      overflow: hidden;
      font-family: "Noto Sans", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    canvas {
      height: 100vh;
      width: 100vw;
      position: relative;
      z-index: 9;
    }

    #background-image,
    #background-filter {
      height: 100%;
      width: 100%;
      position: fixed;
      top: 0px;
      left: 0px;
    }
      
    #background-image {
      z-index: 1;
      background-image: url("https://images.unsplash.com/photo-1505136026201-bbc1bc0949fa?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-position: center;
      opacity: 0.6;
      filter: blur(4px) grayscale(30%);
    }

    #background-filter {
      z-index: 2;
      background: radial-gradient(rgb(0 0 0 / 60%) 50%, transparent);
    }

    #logo {
      display: flex;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      opacity: 0.2;
      pointer-events: none; 
    }

    #logo > img {
      height: 18vmin; 
      width: auto;
    }

    #control-bar-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      position: fixed;
      top: 0px;
      left: 0px;
      z-index: 10;
      padding: 0.5rem;
    }

    .toggle {
      background-color: rgb(255 255 255 / 10%);
      backdrop-filter: blur(5px);
      padding: 0.5rem;
      border-radius: 0.25rem;
      height: 2rem;
      border: none;
      outline: none;
      cursor: pointer;
    }

    .toggle:is(:hover, :focus-visible) {
      background-color: rgb(255 255 255 / 15%);
    }

    .toggle > i {
      color: white;
      display: none;
      height: 1rem;
      width: 1rem;
      font-size: 0.6rem;
      line-height: 1rem;
      text-align: center;
    }

    .toggle[data-toggled="true"] > i.on {
      display: block;
    }

    .toggle[data-toggled="false"] > i.off {
      display: block;
    }

    #sound-message {
      position: fixed;
      top: 36%;
      left: 50%;
      translate: -50% -50%;
      z-index: 3;
      padding: 0.75rem;
      background-color: rgb(255 255 255 / 5%);
      border-radius: 0.4rem;
      transition: opacity 1000ms;
      pointer-events: none;
    }

    body:has(#sound-toggle[data-toggled="true"]) #sound-message {
      opacity: 0;
    }

    #sound-message > p {
      color: white;
      font-size: 0.9rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="control-bar-wrapper">
    <div id="control-bar">
      <button id="sound-toggle" class="toggle" type="button" data-toggled="false" onClick="handleSoundToggle()" title="Toggle Pulse">
        <i class="fa-solid fa-music-slash off"></i>
        <i class="fa-solid fa-music on"></i>
      </button>
    </div>
  </div>

  <div id="background-image"></div>
  <div id="background-filter"></div>

  <div id="logo">
    <img src="https://working-draft.org/assets/working-draft-flower.png" alt="Working Draft" />
  </div>

  <div id="sound-message">
    <p>Click anywhere to toggle sound</p>
  </div>

  <canvas id="paper"></canvas>

  <script>
    const paper = document.getElementById("paper"),
          pen = paper.getContext("2d");

    const get = selector => document.querySelector(selector);

    const toggles = {
      sound: get("#sound-toggle")
    }

    const colors = Array(21).fill("#A6C48A");

    const settings = {
      startTime: new Date().getTime(),
      duration: 900,
      maxCycles: Math.max(colors.length, 100),
      soundEnabled: false,
      pulseEnabled: true
    }

    let audioCtx;
    const frequencies = Array(21).fill(0).map((_, i) => {
      const baseNote = 146.83; 
      const scale = [0, 3, 5, 7, 10]; 
      const octave = Math.floor(i / 5);
      const degree = i % 5;
      return baseNote * Math.pow(2, octave + (scale[degree] / 12));
    });

    const playKey = index => {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc.type = 'sine'; 
      osc.frequency.setValueAtTime(frequencies[frequencies.length - 1 - index], audioCtx.currentTime);

      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
      gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 2.6);
    };

    const handleSoundToggle = (enabled = !settings.soundEnabled) => {  
    settings.soundEnabled = enabled;
    toggles.sound.dataset.toggled = enabled;
    
    if (enabled) {
      if (navigator.audioSession) navigator.audioSession.type = 'playback';

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }
    };

    document.onvisibilitychange = () => handleSoundToggle(false);
    paper.onclick = () => handleSoundToggle();

    let arcs = [];

    const calculateVelocity = index => {  
        const numberOfCycles = settings.maxCycles - index,
              distancePerCycle = 2 * Math.PI;
      return (numberOfCycles * distancePerCycle) / settings.duration;
    }

    const calculateNextImpactTime = (currentImpactTime, velocity) => {
      return currentImpactTime + (Math.PI / velocity) * 1000;
    }

    const calculateDynamicOpacity = (currentTime, lastImpactTime, baseOpacity, maxOpacity, duration) => {
      const timeSinceImpact = currentTime - lastImpactTime,
            percentage = Math.min(timeSinceImpact / duration, 1),
            opacityDelta = maxOpacity - baseOpacity;
      
      return maxOpacity - (opacityDelta * percentage);
    }

    const determineOpacity = (currentTime, lastImpactTime, baseOpacity, maxOpacity, duration) => {
      if(!settings.pulseEnabled) return baseOpacity;
      return calculateDynamicOpacity(currentTime, lastImpactTime, baseOpacity, maxOpacity, duration);
    }

    const calculatePositionOnArc = (center, radius, angle) => ({
      x: center.x + radius * Math.cos(angle),
      y: center.y + radius * Math.sin(angle)
    });

    const init = () => {
      pen.lineCap = "round";

      arcs = colors.map((color, index) => {
        const velocity = calculateVelocity(index),
              lastImpactTime = 0,
              nextImpactTime = calculateNextImpactTime(settings.startTime, velocity);

        return { color, velocity, lastImpactTime, nextImpactTime }
      });
    }

    const drawArc = (x, y, radius, start, end, action = "stroke") => {
      pen.beginPath();
      pen.arc(x, y, radius, start, end);
      if(action === "stroke") pen.stroke();    
      else pen.fill();
    }

    const drawPointOnArc = (center, arcRadius, pointRadius, angle) => {
      const position = calculatePositionOnArc(center, arcRadius, angle);
      drawArc(position.x, position.y, pointRadius, 0, 2 * Math.PI, "fill");    
    }

    const draw = () => {
      paper.width = paper.clientWidth;
      paper.height = paper.clientHeight;

      const currentTime = new Date().getTime(),
            elapsedTime = (currentTime - settings.startTime) / 1000;
      
      const length = Math.min(paper.width, paper.height) * 0.9,
            offset = (paper.width - length) / 2;
      
      const start = { x: offset, y: paper.height / 2 }
      const end = { x: paper.width - offset, y: paper.height / 2 }
      const center = { x: paper.width / 2, y: paper.height / 2 }

      const base = {
        length: end.x - start.x,
        minAngle: 0,
        startAngle: 0,
        maxAngle: 2 * Math.PI
      }

      base.initialRadius = base.length * 0.05;
      base.circleRadius = base.length * 0.006;
      base.clearance = base.length * 0.03;
      base.spacing = (base.length - base.initialRadius - base.clearance) / 2 / colors.length;

      arcs.forEach((arc, index) => {
        const radius = base.initialRadius + (base.spacing * index);

        pen.globalAlpha = determineOpacity(currentTime, arc.lastImpactTime, 0.15, 0.65, 1000);
        pen.lineWidth = base.length * 0.002;
        pen.strokeStyle = arc.color;
        
        const offset = base.circleRadius * (5 / 3) / radius;
        
        drawArc(center.x, center.y, radius, Math.PI + offset, (2 * Math.PI) - offset);
        drawArc(center.x, center.y, radius, offset, Math.PI - offset);
        
        pen.globalAlpha = determineOpacity(currentTime, arc.lastImpactTime, 0.15, 0.85, 1000);
        pen.fillStyle = arc.color;
        
        drawPointOnArc(center, radius, base.circleRadius * 0.75, Math.PI);
        drawPointOnArc(center, radius, base.circleRadius * 0.75, 2 * Math.PI);
        
        pen.globalAlpha = 1;
        pen.fillStyle = arc.color;
        
        if(currentTime >= arc.nextImpactTime) {
          const interval = (Math.PI / arc.velocity) * 1000;

          // Jump past any impacts missed while the tab was hidden/throttled
          const missed = Math.floor((currentTime - arc.nextImpactTime) / interval);
          arc.lastImpactTime = arc.nextImpactTime + missed * interval;
          arc.nextImpactTime = arc.lastImpactTime + interval;

          // Only sound impacts that are happening now, not stale ones
          if(settings.soundEnabled && currentTime - arc.lastImpactTime < 100) {
            playKey(index);
          }
        }
        
        const distance = elapsedTime >= 0 ? (elapsedTime * arc.velocity) : 0,
              angle = (Math.PI + distance) % base.maxAngle;
        
        drawPointOnArc(center, radius, base.circleRadius, angle);
      });
      
      requestAnimationFrame(draw);
    }

    init();
    draw();
  </script>
</body>
</html>
