{% if page.license == 'cc-by' %}
<aside class="license-card" aria-label="License">
  <div class="license-icons" aria-hidden="true">
    <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" width="28" height="28">
    <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" width="28" height="28">
  </div>
  <div class="license-text">
    <p class="license-title">
      <a href="{{ page.canonical_url | default: page.url | absolute_url }}">{{ page.title }}</a>
    </p>
    <p class="license-meta">
      © {{ page.date | date: "%Y" }} by
      <a href="{{ '/arttu/' | absolute_url }}">Arttu Pitou At</a>
      · Licensed under
      <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener noreferrer">CC BY 4.0</a>
    </p>
  </div>
</aside>
{% endif %}
