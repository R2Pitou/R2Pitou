<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050505">
{% assign page_description = page.summary | default: page.description | default: site.description %}
{% assign canonical_href = page.canonical_url | default: page.url | absolute_url %}
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
<link rel="canonical" href="{{ canonical_href }}">
<meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
<meta property="og:description" content="{{ page_description | strip_html | normalize_whitespace | escape }}">
<meta property="og:url" content="{{ canonical_href }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:type" content="{% if page.collection == 'articles' %}article{% else %}website{% endif %}">
<link rel="preconnect" href="https://api.github.com">
<link rel="preconnect" href="https://github.com">
<link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
<script src="{{ '/assets/site.js' | relative_url }}" defer></script>
