name: Build checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize article and image filenames in build workspace
        run: python scripts/normalize_articles.py

      - name: Check flat article image folder
        shell: bash
        run: |
          set -euo pipefail

          if find assets/images -mindepth 1 -type d | grep -q .; then
            echo "::error::assets/images must stay flat. Do not create nested image folders."
            find assets/images -mindepth 1 -type d
            exit 1
          fi

      - name: Verify protected paths stayed untouched
        shell: bash
        run: |
          if ! git diff --quiet -- cv/ arttu/; then
            echo "::error::Build normalization attempted to change protected cv/ or arttu/ paths."
            git diff -- cv/ arttu/
            exit 1
          fi

  jekyll-build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Normalize article and image filenames in build workspace
        run: python scripts/normalize_articles.py

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
