title: Working-Draft.org
description: A public notebook, portfolio, and publishing hub by Arttu Pitou At.
url: "https://working-draft.org"
baseurl: ""

author:
  name: "Arttu Pitou At"
  khmer_name: "អាតពិទូ"
  url: "https://working-draft.org"

timezone: Asia/Phnom_Penh
future: true

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: "articles"
    values:
      layout: article

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README-dev.md
  - .obsidian
  - .trash
  - _site
  - .jekyll-cache
  - .jekyll-metadata
