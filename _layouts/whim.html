---
layout: default
---

<article class="whim-page">
  <header class="whim-page-header">
    <p class="eyebrow">Whim Du Jour</p>
    <h1>{{ page.title }}</h1>
    <p class="byline">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
  </header>

  {% if page.image %}
    <figure class="whim-hero">
      <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title | escape }}">
    </figure>
  {% endif %}

  <section class="whim-transcript" aria-labelledby="whim-transcript-title">
    <h2 id="whim-transcript-title">Text</h2>
    <div class="whim-content">
      {{ content }}
    </div>
  </section>

  <div class="whim-page-actions">
    <a href="{{ '/whims/' | relative_url }}" class="repo-link">All Whims</a>
    <a href="{{ '/' | relative_url }}" class="repo-link repo-link-secondary">Home</a>
  </div>
</article>
