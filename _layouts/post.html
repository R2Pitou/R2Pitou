---
layout: default
---

<article class="post">
  <header class="post-header">
    <p class="eyebrow">{{ page.categories }}</p>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
    </p>
    {% if page.summary %}
      <p class="post-summary">{{ page.summary }}</p>
    {% endif %}
    {% if page.tags %}
      <div class="tag-list" aria-label="Article tags">
        {% for tag in page.tags %}
          <span>{{ tag }}</span>
        {% endfor %}
      </div>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
